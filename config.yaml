# Marcus - static default configuration
#
# These values are ONLY used as defaults the first time a server (guild)
# is seen, or as fallback values. Once Marcus stores settings for a guild
# or channel in SQLite (via slash commands like /responsechance, /channel,
# etc.), those DB values take over and survive restarts. Editing this file
# after the bot has already run will NOT retroactively change a guild's
# stored settings.

bot:
  name: Marcus

response:
  global_chance: 3        # percent chance (0-100) an eligible message triggers a response
  cooldown_seconds: 30     # minimum seconds between Marcus responses in a channel
  max_words: 35
  min_words: 4

gif:
  enabled: true
  response_chance: 25      # percent of Marcus's responses that are GIF-only
  channel_local_preference: true   # prefer GIFs logged in the same channel first

generation:
  mode: mixed               # markov | fragments | mixed
  markov_order: 2

database:
  path: marcus.db
