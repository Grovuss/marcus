# fly.toml app configuration file generated for marcus-ebmldg on 2026-08-07T11:01:46Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'marcus-ebmldg'
primary_region = 'ord'

[build]
  dockerfile = "Dockerfile"
  
[processes]
  app = "python bot.py"

# Admin dashboard (services/dashboard.py). Only listens if the
# DASHBOARD_PASSWORD secret is set. The bot must stay running for
# Discord, so the machine is never auto-stopped.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
